[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masare"
version = "1.0.0"
description = "Enterprise-grade Malware Analysis Sandbox with Automated Reverse Engineering"
readme = "README.md"
authors = [
    {name = "MASARE Project", email = "masare@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
]
keywords = [
    "malware",
    "analysis",
    "sandbox",
    "reverse-engineering",
    "cuckoo",
    "yara",
    "threat-intelligence",
    "security",
    "dfir",
    "incident-response",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "yara-python>=4.3.1",
    "jinja2>=3.1.2",
    "pandas>=2.1.0",
    "pefile>=2023.2.7",
    "python-magic>=0.4.27",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "pylint>=2.17.5",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
]
docs = [
    "sphinx>=7.1.2",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
all = [
    "masare[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/Raoof128/MASARE"
Documentation = "https://github.com/Raoof128/MASARE/blob/main/README.md"
Repository = "https://github.com/Raoof128/MASARE"
Issues = "https://github.com/Raoof128/MASARE/issues"
Changelog = "https://github.com/Raoof128/MASARE/blob/main/CHANGELOG.md"

[project.scripts]
masare-analyze = "automation.batch_analyzer:main"
masare-report = "automation.report_generator:main"
masare-yara = "detection.yara.signature_generator:main"

[tool.setuptools]
packages = ["analysis", "automation", "detection"]

[tool.setuptools.package-data]
"*" = ["*.conf", "*.yml", "*.yaml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["analysis", "automation", "detection"]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=analysis --cov=automation --cov=detection"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["analysis", "automation", "detection"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["/tests", "/examples"]
skips = ["B101", "B601"]
